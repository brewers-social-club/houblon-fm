    bed_duration_seconds: 14
  - id: identite-decapsule
    category: station_ids
    character: presenter
    delivery: [excited, mischievous]
    text: >-
      Houblon FM. Ici, on décapsule l'actualité brassicole sans secouer les faits.
    bed_prompt: >-
