[project]
name = "bsc-radio"
version = "0.1.0"
description = "Webradio thématique francophone, sourcée et produite par des IA"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "anthropic>=0.69,<1",
  "feedparser>=6.0.12,<7",
  "google-genai>=1.46,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0.2,<7",
  "trafilatura>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
  "fastapi>=0.118,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=7,<8", "ruff>=0.13,<1"]

[project.scripts]
radio = "bsc_radio.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsc_radio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
