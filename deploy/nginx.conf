server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /episodes/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://sidecar:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /live.mp3 { proxy_pass http://icecast:8000/live.mp3; proxy_buffering off; }
  location /admin/ { try_files $uri /admin/index.html; }
  location /audio/ { auth_request /_auth; proxy_pass http://sidecar:8081/audio/; }
  location = /_auth { internal; proxy_pass http://sidecar:8081/api/me; proxy_pass_request_body off; proxy_set_header Cookie $http_cookie; }
}
