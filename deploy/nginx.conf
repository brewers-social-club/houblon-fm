server {
  listen 80;
  # Keep nginx's automatic directory redirects relative. The public reverse
  # proxy reaches this container through its LAN address, which must never be
  # exposed in a Location header (for example /admin -> /admin/).
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  location = /admin {
    add_header Cache-Control "no-store" always;
    try_files /admin/index.html =404;
  }
  location /episodes/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://sidecar:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /live.mp3 { proxy_pass http://icecast:8000/live.mp3; proxy_buffering off; }
  location /admin/ { try_files $uri /admin/index.html; }
  # Publisher only copies visible, published episodes into this directory.
  # Serving those static copies makes public episode players and podcast
  # enclosures usable without exposing draft or withdrawn source files.
  location /audio/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
  }
}
