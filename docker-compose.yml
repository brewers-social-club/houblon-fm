services:
  sidecar:
    build: .
    env_file: .env
    environment:
      RADIO_DATA_DIR: /data
      RADIO_CONFIG_DIR: /config
      RADIO_SITE_DIR: /site
    command: ["radio","sidecar","--host","0.0.0.0","--port","8081"]
    volumes: ["./data:/data", "./site/public:/site", "./config:/config"]
    healthcheck: {test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://localhost:8081/health')"], interval: 15s, timeout: 5s, retries: 5}
  icecast:
    image: libretime/icecast:2.4.4
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_HOSTNAME: localhost
    ports: ["8000:8000"]
  liquidsoap:
    build:
      context: .
      dockerfile: deploy/Dockerfile.liquidsoap
    depends_on:
      sidecar:
        condition: service_healthy
      icecast:
        condition: service_started
    env_file: .env
    volumes: ["./data:/data", "./deploy/liquidsoap.liq:/radio.liq:ro"]
    command: ["liquidsoap","/radio.liq"]
  web:
    image: nginx:1.27-alpine
    depends_on: [sidecar, icecast]
    ports: ["8080:80"]
    volumes: ["./site/public:/usr/share/nginx/html:ro", "./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
