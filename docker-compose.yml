services:
  sidecar:
    build: .
    env_file: .env
    environment:
      RADIO_DATA_DIR: /data
      RADIO_CONFIG_DIR: /config
      RADIO_SITE_DIR: /site
    command: ["radio","sidecar","--host","0.0.0.0","--port","8081"]
    volumes: ["./data:/data", "./site/public:/site", "./config:/config"]
    healthcheck: {test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://localhost:8081/health')"], interval: 15s, timeout: 5s, retries: 5}
  icecast:
    image: libretime/icecast:2.4.4
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_HOSTNAME: localhost
    ports: ["8000:8000"]
  liquidsoap:
    build:
      context: .
      dockerfile: deploy/Dockerfile.liquidsoap
    depends_on:
      sidecar:
        condition: service_healthy
      icecast:
        condition: service_started
    env_file: .env
    volumes: ["./data:/data", "./deploy/liquidsoap.liq:/radio.liq:ro"]
    command: ["liquidsoap","/radio.liq"]
  youtube-live:
    profiles: ["youtube"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.youtube
    depends_on:
      icecast:
        condition: service_started
      liquidsoap:
        condition: service_started
    restart: unless-stopped
    environment:
      YOUTUBE_STREAM_KEY: ${YOUTUBE_STREAM_KEY:-}
      YOUTUBE_RTMPS_URL: ${YOUTUBE_RTMPS_URL:-rtmps://a.rtmps.youtube.com:443/live2}
      YOUTUBE_AUDIO_URL: http://icecast:8000/live.mp3
      YOUTUBE_ARTWORK: /artwork/houblon-fm-logo.png
    volumes:
      - ./site/public/assets/houblon-fm-logo-v3.png:/artwork/houblon-fm-logo.png:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x ffmpeg >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  web:
    image: nginx:1.27-alpine
    depends_on: [sidecar, icecast]
    ports: ["8080:80"]
    volumes: ["./site/public:/usr/share/nginx/html:ro", "./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
