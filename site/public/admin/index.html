<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · Houblon FM</title><link rel="stylesheet" href="/assets/app.css"></head><body><header><a class="brand" href="/">Houblon FM</a></header><main><section><p class="eyebrow">ADMINISTRATION</p><h1>Le studio</h1><div id="dashboard" class="grid"><p>Chargement…</p></div></section></main><script>fetch('/api/admin/dashboard',{headers:{'x-radio-admin-password':prompt('Mot de passe administrateur')}}).then(r=>r.json()).then(d=>{document.querySelector('#dashboard').innerHTML=`<article class="card"><span>Coûts</span><h3>${Number(d.cost_eur).toFixed(2)} €</h3></article><article class="card"><span>Incidents</span><h3>${d.incidents.length}</h3></article><article class="card"><span>Tâches</span><h3>${d.tasks.length}</h3></article><article class="card"><span>Avis</span><h3>${d.feedback.length}</h3></article>`}).catch(()=>document.querySelector('#dashboard').textContent='Accès refusé')</script></body></html>
