<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compte · Houblon FM</title><link rel="stylesheet" href="/assets/app.css"></head><body><header><a class="brand" href="/">Houblon FM</a></header><main><article><p class="eyebrow">REPLAYS & PODCAST</p><h1>Votre compte</h1><form id="login"><label>E-mail<input name="email" type="email" required style="width:100%"></label><label>Mot de passe<input name="password" type="password" minlength="10" required style="width:100%"></label><p><button class="primary">Se connecter</button></p></form><p id="message"></p><script>login.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',body:new FormData(login)});message.textContent=r.ok?'Connexion réussie.':'Identifiants invalides.'}</script></article></main></body></html>
